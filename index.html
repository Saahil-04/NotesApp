<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">

        <h1>Notes App</h1>

        <button id="logout-btn">Log Out</button>

        <div id="input-section">
            <input type="text" id="title" class="text" placeholder="Enter the title..">
            <textarea name="desc" id="desc" class="text" placeholder="Describe your note.."></textarea>
            <button id="save-btn">Save Note</button>

        </div>

        <div id="notes-container">

        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
