<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Notes App</title>
</head>

<body>
    <div id="auth-container">
        <h1>Login</h1>

        <div id="auth-form">
            <input type="email" id="email" class="text" placeholder="Email">
            <input type="password" id="password" class="text" placeholder='Password'>
            <button id="login-btn">Log In</button>
            <p id="error-msg"></p>

            <p id="switch-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>

</html>
