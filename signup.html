<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Notes App</title>
</head>

<body>
    <div id="auth-container">
        <h1>Sign Up</h1>

        <div id="auth-form">
            <input type="email" id="email" class="text" placeholder="Email">
            <input type="password" id="password" class="text" placeholder="Password">
            <button id="signup-btn">Sign Up</button>

            <p id="error-msg"></p>
            <p id="switch-link">Already have an account? <a href="login.html">Log In</a></p>
        </div>
    </div>

    <script src="signup.js"></script>
</body>

</html>
